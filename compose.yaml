services:
  app:
    build:
      context: .
    image: deli:latest
    container_name: deli
    restart: unless-stopped
    network_mode: host
    environment:
      SERVER_PORT: "${APP_PORT:-8080}"
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:mariadb://localhost:3306/delidb}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      SPRING_SERVLET_MULTIPART_LOCATION: /app/uploads
      COM_DELIGENCE_UPLOAD_PATH: /app/uploads
      TZ: Asia/Seoul
    volumes:
      - "${UPLOAD_PATH:-/home/lkserver/upload}:/app/uploads"

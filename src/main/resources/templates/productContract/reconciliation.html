<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<div layout:fragment="content">
    <h1>입금·수금 장부 대사</h1>
    <form method="get" th:action="@{/productContract/receivables/reconciliation}">
        <label><input type="checkbox" name="onlyDifferences" value="true" th:checked="${onlyDifferences}"> 확인 필요만 보기</label>
        <button>조회</button>
    </form>
    <p th:if="${rows.empty}" th:text="${onlyDifferences ? '확인할 차이가 없습니다.' : '가져온 입금이 없습니다.'}"></p>
    <section th:each="row : ${rows}" class="border-top py-2">
        <h2 th:text="|${row.deposit.reference} · ${row.deposit.payer}|"></h2>
        <p th:text="|${row.deposit.depositDate} · 원입금 ${row.deposit.amount}원|"></p>
        <p th:text="|장부 수금 ${row.received}원 · 환불·정산 ${row.settled}원 · 미배분 ${row.remaining}원 · 미해결 차이 ${row.difference}원|"></p>
        <a th:href="@{/productContract/receivables/deposits(reference=${row.deposit.reference})}">입금 연결·정정</a>
        <table class="table" th:unless="${row.allocations.empty}">
            <thead><tr><th>계약·수금</th><th>배분액</th><th>장부 대조 결과</th></tr></thead>
            <tbody><tr th:each="a : ${row.allocations}">
                <td><a th:href="|@{/productContract/{id}/billing(id=${a.contractNo})}#entry-${a.receiptId}|" th:text="|계약 #${a.contractNo} · 수금 #${a.receiptId}|"></a></td>
                <td th:text="|${a.amount}원|"></td><td th:text="${a.status}"></td>
            </tr></tbody>
        </table>
    </section>
</div></html>

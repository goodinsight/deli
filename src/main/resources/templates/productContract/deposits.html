<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<div layout:fragment="content">
    <h1>입금 내역 가져오기·연결</h1>
    <a th:href="@{/productContract/receivables}">고객사별 미수 현황</a>
    <p>UTF-8 CSV 첫 행은 거래번호,입금일,입금액,입금자 순서입니다. 모든 계좌에서 고유한 거래번호, YYYY-MM-DD 날짜, 쉼표 없는 원화 금액을 사용하세요.</p>
    <form method="post" enctype="multipart/form-data" th:action="@{/productContract/receivables/deposits}">
        <label>CSV 파일 (최대 1MB) <input type="file" name="file" accept=".csv" required></label><button>가져오기</button>
    </form>
    <p role="status" th:if="${message}" th:text="${message}"></p>
    <table class="table"><thead><tr><th>거래번호</th><th>입금일</th><th>입금자</th><th>금액</th><th>배분액 / 미배분액</th><th>연결할 청구</th></tr></thead>
        <tbody><tr th:each="d : ${deposits}"><td th:text="${d.reference}"></td><td th:text="${d.depositDate}"></td><td th:text="${d.payer}"></td><td th:text="${d.amount}"></td>
            <td th:text="|${d.allocatedAmount}원 / ${d.remainingAmount}원|"></td>
            <td><div th:each="r : ${d.activeReceipts}"><a th:href="@{/productContract/{id}/billing(id=${r.contract.productContractNo})}" th:text="|연결한 계약 #${r.contract.productContractNo} · ${r.amount}원|"></a>
                <form method="post" th:action="@{/productContract/receivables/deposits/unmatch}">
                    <input type="hidden" name="reference" th:value="${d.reference}">
                    <input type="hidden" name="receiptId" th:value="${r.id}">
                    <label>연결 해제 사유 <input name="reason" required maxlength="250"></label>
                    <button>수금 연결 해제</button>
                </form>
                </div>
                <form th:if="${d.remainingAmount.signum() > 0}" method="post" th:action="@{/productContract/receivables/deposits/match}">
                    <input type="hidden" name="reference" th:value="${d.reference}">
                    <input type="hidden" name="matchKey" th:value="${d.receiptKey}">
                    <label>배분액(원) <input type="number" name="amount" min="0.01" step="0.01" th:max="${d.remainingAmount}" th:value="${d.remainingAmount}" required></label>
                    <select name="contractNo" required><option value="">미연결 · 청구 선택</option>
                        <optgroup th:each="c : ${customers}" th:label="${c.name}">
                            <option th:each="i : ${c.invoices}" th:if="${d.canAllocateTo(i.contract)}" th:value="${i.contract.productContractNo}" th:text="|#${i.contract.productContractNo} ${i.contract.productContractCode} · 잔액 ${i.balance}원|"></option>
                        </optgroup>
                    </select><button>수금 연결</button>
                </form>
            </td></tr></tbody>
    </table>
    <section th:unless="${corrections.empty}">
        <h2>입금 연결 정정 이력</h2>
        <table class="table"><thead><tr><th>거래번호</th><th>해제한 계약·수금</th><th>사유</th><th>처리자</th><th>시각(UTC)</th></tr></thead>
            <tbody><tr th:each="c : ${corrections}">
                <td th:text="${c.deposit.reference}"></td>
                <td><a th:href="@{/productContract/{id}/billing(id=${c.receipt.contract.productContractNo})}" th:text="|계약 #${c.receipt.contract.productContractNo} · 수금 #${c.receipt.id}|"></a></td>
                <td th:text="${c.reason}"></td><td th:text="${c.recordedBy}"></td><td th:text="${c.recordedAt}"></td>
            </tr></tbody>
        </table>
    </section>
</div></html>

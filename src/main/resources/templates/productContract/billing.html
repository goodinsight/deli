<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<div layout:fragment="content">
    <h1 th:text="|${contract.clientName} · 계약 ${contract.productContractCode} 청구·수금|"></h1>
    <a th:href="@{/productContract/read(productContractNo=${contract.productContractNo})}">계약 상세</a>
    <p th:if="${entries.empty}">청구 전</p>
    <form th:if="${entries.empty and contract.productContractState != '계약파기'}" method="post"
          th:action="@{/productContract/{id}/billing/invoice(id=${contract.productContractNo})}">
        <label>확정할 청구액(원) <input name="amount" type="number" min="0.01" step="0.01" required th:value="${suggested}"></label>
        <button>청구 확정</button>
    </form>
    <section th:unless="${entries.empty}">
        <p th:text="|청구액 ${entries[0].amount}원 · 누적 수금액 ${entries[0].amount.subtract(balance)}원 · 미수잔액 ${balance}원|"></p>
        <form th:if="${balance.signum() > 0}" method="post" th:action="@{/productContract/{id}/billing/receipts(id=${contract.productContractNo})}">
            <input type="hidden" name="requestId" th:value="${requestId}">
            <label>수금액(원) <input type="number" name="amount" min="0.01" step="0.01" th:max="${balance}" required></label>
            <button>수금 등록</button>
        </form>
        <table class="table">
            <thead><tr><th>구분</th><th>금액(원)</th><th>등록자</th><th>등록 시각(UTC)</th></tr></thead>
            <tbody><tr th:each="entry : ${entries}"><td th:text="${entry.invoice ? '청구' : '수금'}"></td>
                <td th:text="${entry.amount}"></td><td th:text="${entry.recordedBy}"></td><td th:text="${entry.recordedAt}"></td>
            </tr></tbody>
        </table>
    </section>
</div>
</html>

<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>구매 협력회사 상세</title>
</head>

<div layout:fragment="content">

    <div class="row mt-3">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    구매 협력회사 상세
                </div>
                <div class="card-body mt-3">
                    <div class="input-group mb-3 d-none">
                        <span class="input-group-text">구매협력회사 일련번호</span>
                        <input type="text" name="clientNo" class="form-control clientNo" th:value="${dto.clientNo}" readonly>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">사업자등록번호</span>
                        <input type="text" name="corporateRegistrationNo" class="form-control corporateRegistrationNo" th:value="${dto.corporateRegistrationNo}" readonly>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">회사 명</span>
                        <input type="text" name="clientName" class="form-control clientName" th:value="${dto.clientName}" readonly>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">대표자 명</span>
                        <input type="text" name="clientCeo" class="form-control clientCeo" th:value="${dto.clientCeo}" readonly>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">주소</span>
                        <input type="text" name="clientAddress" class="form-control clientAddress" th:value="${dto.clientAddress}" readonly>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">연락처</span>
                        <input type="text" name="clientPhone" class="form-control clientPhone" th:value="${dto.clientPhone}" readonly>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">이메일</span>
                        <input type="text" name="clientEmail" class="form-control clientEmail" th:value="${dto.clientEmail}" readonly>
                    </div>
                    <div class="input-group mb-3">
                        <span class="input-group-text">계약상태</span>
                        <input type="text" name="clientStatus" class="form-control clientStatus" th:value="${dto.clientStatus}" readonly>
                    </div>
                    <div class="input-group mb-3 ">
                        <span class="input-group-text">비고</span>
                        <textarea name="clientEtc" rows="5" cols="50" class="form-control h-25" readonly>[[${dto.clientEtc}]]</textarea>
                    </div>

                    <section aria-labelledby="consultations">
                        <h2 id="consultations">상담 이력</h2>
                        <p role="alert" th:if="${consultationMessage}" th:text="${consultationMessage}"></p>
                        <form method="post" th:action="@{/CooperatorClient/consultations}">
                            <input type="hidden" name="clientNo" th:value="${dto.clientNo}">
                            <label>상담 일시 <input type="datetime-local" name="consultedAt" required></label>
                            <label>연락 방식 <select name="channel" required>
                                <option th:each="channel : ${channels}" th:text="${channel}" th:value="${channel}"></option>
                            </select></label>
                            <label class="d-block">상담 내용
                                <textarea class="form-control" name="notes" maxlength="2000" required></textarea>
                            </label>
                            <button class="btn btn-primary my-2" type="submit">상담 등록</button>
                        </form>
                        <p th:if="${consultations.empty}">등록된 상담이 없습니다.</p>
                        <article class="border-top py-2" th:each="item : ${consultations}" th:id="|consultation-${item.id}|">
                            <strong th:text="${#temporals.format(item.consultedAt, 'yyyy-MM-dd HH:mm')}"></strong>
                            <span th:text="${item.channel}"></span> · <span th:text="${item.author}"></span>
                            <p style="white-space: pre-wrap" th:text="${item.notes}"></p>
                            <a th:href="@{/CooperatorClient/consultations/{id}/quotes(id=${item.id})}">견적 작성·이력</a>
                            <form th:if="${item.assignee == null}" method="post" th:action="@{/CooperatorClient/consultations/schedule}">
                                <input type="hidden" name="id" th:value="${item.id}">
                                <label>후속 담당자 <select name="employeeNo" required>
                                    <option value="">담당자 선택</option>
                                    <option th:each="e : ${assignees}" th:value="${e.employeeNo}" th:text="|${e.employeeName} (${e.employeeId})|"></option>
                                </select></label>
                                <label>연락 예정일 <input type="date" name="dueDate" required></label>
                                <button class="btn btn-secondary">후속 연락 지정</button>
                            </form>
                            <div th:if="${item.assignee != null}">
                                <p th:text="|후속 담당자 ${item.assignee.employeeId} · ${item.dueDate} · ${item.followUpResult == null ? '예정' : '완료'}|"></p>
                                <p style="white-space: pre-wrap" th:text="${item.followUpResult}"></p>
                                <form th:if="${item.followUpResult == null and item.assignee.employeeId == #authentication.name}"
                                      method="post" th:action="@{/CooperatorClient/consultations/complete}">
                                    <input type="hidden" name="id" th:value="${item.id}">
                                    <label>처리 결과 <textarea name="result" maxlength="2000" required></textarea></label>
                                    <button class="btn btn-primary">연락 완료</button>
                                </form>
                            </div>
                        </article>
                    </section>
                    <div class="my-4">
                        <div class="float-end" th:with="link = ${pageRequestDTO.getLink()}" >
                            <a th:href="|@{CooperatorClient}?${link}|" class="text-decoration-none">
                                <button type="button" class="btn btn-primary">구매협력회사 목록</button>
                            </a>
                            <a th:href="|@{CooperatorClient}&${link}|" class="text-decoration-none">
                                <button type="button" class="btn btn-secondary">수정</button>
                            </a>
                        </div>
                    </div>

                </div><!-- end card body -->
            </div><!-- end card -->
        </div><!-- end col -->
    </div><!-- end row -->

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</div>




<script layout:fragment="script" th:inline="javascript">

    console.log([[${dto}]])


</script>




</html>

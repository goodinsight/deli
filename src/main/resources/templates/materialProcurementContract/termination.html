<section xmlns:th="http://www.thymeleaf.org" th:fragment="invoices" th:if="${!openInvoices.empty}">
    <h2>계약 파기 전 확인할 매입 청구</h2>
    <p>각 청구의 지급 내역을 확인하고 청구를 취소하세요.</p>
    <ul><li th:each="i : ${openInvoices}">
        <a th:href="@{/materialProcurementContract/{id}/invoices(id=${dto.materialProcurementContractNo})} + |#invoice-${i.id}|" th:text="${i.number}"></a>
        <span th:text="|실지급액 ${i.paidAmount}원 · 미지급액 ${i.outstandingAmount}원|"></span>
    </li></ul>
</section>

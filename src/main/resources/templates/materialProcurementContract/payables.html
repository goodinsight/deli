<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<div layout:fragment="content">
    <h1>공급사별 미지급·연체 현황</h1>
    <p th:text="|기준일 ${today} (한국 시간)|"></p>
    <form method="get" th:action="@{/materialProcurementContract/payables}">
        <label>지급 예정일 <select name="window">
            <option value="ALL" th:selected="${window == 'ALL'}">전체</option>
            <option value="TODAY" th:selected="${window == 'TODAY'}">오늘 지급</option>
            <option value="NEXT_SEVEN" th:selected="${window == 'NEXT_SEVEN'}">향후 7일</option>
        </select></label>
        <button type="submit">조회</button>
    </form>
    <section th:if="${window != 'ALL'}">
        <p th:text="|지급 예정일 ${start} ~ ${end}|"></p>
        <p th:text="|지급 예정 합계 ${upcoming.invoices.size()}건 · ${upcoming.total}원|"></p>
        <ul th:unless="${upcoming.invoices.empty}" aria-label="공급사별 지급 예정 소계">
            <li th:each="g : ${upcoming.suppliers}"
                th:text="|${g.supplier.supplierName} (#${g.supplier.supplierNo}) · ${g.openInvoices.size()}건 · ${g.total}원|"></li>
        </ul>
        <p th:if="${upcoming.invoices.empty}">해당 기간에 지급할 청구가 없습니다.</p>
        <table class="table" th:unless="${upcoming.invoices.empty}">
            <thead><tr><th>지급 예정일</th><th>공급사</th><th>청구번호</th><th>미지급액</th></tr></thead>
            <tbody><tr th:each="i : ${upcoming.invoices}">
                <td th:text="${i.dueDate}"></td><td th:text="${i.supplier.supplierName}"></td>
                <td><a th:href="|@{/materialProcurementContract/{id}/invoices(id=${i.contract.materialProcurementContractNo})}#invoice-${i.id}|" th:text="${i.number}"></a></td>
                <td th:text="|${i.outstandingAmount}원|"></td>
            </tr></tbody>
        </table>
    </section>
    <p th:if="${window == 'ALL' and groups.empty}">미지급 청구가 없습니다.</p>
    <details th:each="g : ${groups}">
        <summary th:text="|${g.supplier.supplierName} (#${g.supplier.supplierNo}) · 총 미지급 ${g.total}원 · 연체 ${g.overdue}원|"></summary>
        <ul th:unless="${g.aging.empty}" aria-label="연체 기간별 미지급액">
            <li th:each="bucket : ${g.aging}" th:text="|${bucket.key.label} 연체 · ${bucket.value}원|"></li>
        </ul>
        <table class="table">
            <thead><tr><th>청구번호</th><th>조달계약</th><th>지급 예정일</th><th>상태</th><th>미지급액</th></tr></thead>
            <tbody><tr th:each="i : ${g.openInvoices}">
                <td><a th:href="|@{/materialProcurementContract/{id}/invoices(id=${i.contract.materialProcurementContractNo})}#invoice-${i.id}|" th:text="${i.number}"></a></td>
                <td><a th:href="@{/materialProcurementContract/read(materialProcurementContractNo=${i.contract.materialProcurementContractNo})}"
                       th:text="|${i.contract.materialProcurementContractCode} (#${i.contract.materialProcurementContractNo})|"></a></td>
                <td th:text="${i.dueDate}"></td><td th:text="${i.dueDate.isBefore(today) ? '연체' : (i.dueDate.equals(today) ? '오늘' : '예정')}"></td>
                <td th:text="|${i.outstandingAmount}원|"></td>
            </tr></tbody>
        </table>
    </details>
</div></html>

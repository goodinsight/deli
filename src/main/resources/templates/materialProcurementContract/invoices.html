<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
<div layout:fragment="content">
    <a th:href="@{/materialProcurementContract/payables}">공급사별 미지급·연체 현황</a>
    <h1>매입 청구 등록·내역</h1>
    <p th:text="|계약 ${contract.materialProcurementContractCode} · 공급사 ${contract.cooperatorSupplier?.supplierName ?: '미지정'}|"></p>
    <a th:href="@{/materialProcurementContract/read(materialProcurementContractNo=${contract.materialProcurementContractNo})}">조달계약 상세</a>
    <form th:if="${contract.cooperatorSupplier != null and contract.materialProcurementContractState != '계약파기'}" method="post"
          th:action="@{/materialProcurementContract/{id}/invoices(id=${contract.materialProcurementContractNo})}">
        <label>공급사 청구번호 <input name="number" maxlength="100" required></label>
        <label>청구일 <input type="date" name="invoiceDate" required></label>
        <label>지급 예정일 <input type="date" name="dueDate" required></label>
        <label>청구액(원) <input type="number" name="amount" min="0.01" step="0.01" required></label>
        <button class="btn btn-primary">매입 청구 확정</button>
    </form>
    <p th:text="|계약 미지급액 ${total}원|"></p>
    <table class="table" th:unless="${invoices.empty}">
        <thead><tr><th>청구번호</th><th>청구일</th><th>지급 예정일</th><th>금액(원)</th><th>확정자</th><th>확정 시각(UTC)</th><th>지급·정정</th></tr></thead>
        <tbody><tr th:each="i : ${invoices}" th:id="|invoice-${i.id}|"><td th:text="${i.number}"></td><td th:text="${i.invoiceDate}"></td>
            <td th:text="${i.dueDate}"></td><td th:text="${i.amount}"></td><td th:text="${i.confirmedBy}"></td><td th:text="${i.confirmedAt}"></td>
            <td>
                <p th:text="|원청구액 ${i.amount}원 · 실지급액 ${i.paidAmount}원 · 미지급액 ${i.outstandingAmount}원|"></p>
                <p th:if="${i.cancelledAt != null}" th:text="|청구 취소 · ${i.cancellationReason} · ${i.cancelledBy} · ${i.cancelledAt}|"></p>
                <form th:if="${i.cancelledAt == null and i.payments.empty}" method="post"
                      th:action="@{/materialProcurementContract/{c}/invoices/{i}/cancel(c=${contract.materialProcurementContractNo},i=${i.id})}">
                    <label>청구 취소 사유 <input name="reason" maxlength="250" required></label><button>청구 취소</button>
                </form>
                <form th:if="${i.cancelledAt == null and !i.payments.empty and i.paidAmount.signum() == 0}" method="post"
                      th:action="@{/materialProcurementContract/{c}/invoices/{i}/reconcile-cancel(c=${contract.materialProcurementContractNo},i=${i.id})}">
                    <label><input type="checkbox" name="reconciled" value="true" required>실제 지급 및 환급·정산 내역을 대조했습니다.</label>
                    <label>청구 취소 사유 <input name="reason" maxlength="250" required></label><button>대조 후 청구 취소</button>
                </form>
                <form th:if="${i.outstandingAmount.signum() > 0}" method="post" th:action="@{/materialProcurementContract/{c}/invoices/{i}/payments(c=${contract.materialProcurementContractNo},i=${i.id})}">
                    <input type="hidden" name="requestId" th:value="${requestId}">
                    <label>지급액(원) <input type="number" name="amount" min="0.01" step="0.01" th:max="${i.outstandingAmount}" required></label>
                    <button>지급 기록</button>
                </form>
                <div th:each="p : ${i.payments}">
                    <p th:text="|지급 #${p.id} · ${p.amount}원 · ${p.recordedBy} · ${p.recordedAt}|"></p>
                    <p th:if="${p.cancelledAt != null}" th:text="|취소 · ${p.cancellationReason} · ${p.cancelledBy} · ${p.cancelledAt}|"></p>
                    <p th:if="${p.settledAt != null}" th:text="|${p.settlementType.name() == 'REFUND' ? '공급사 환급' : '대체 정산'} · ${p.settlementEvidence} · ${p.settledBy} · ${p.settledAt}|"></p>
                    <form th:if="${p.effective}" method="post"
                          th:action="@{/materialProcurementContract/{c}/invoices/{i}/payments/{p}/settle(c=${contract.materialProcurementContractNo},i=${i.id},p=${p.id})}">
                        <label>처리 유형 <select name="type" required><option value="">선택</option><option value="REFUND">공급사 환급</option><option value="OFFSET">대체 정산</option></select></label>
                        <label>전액 처리 근거 <input name="evidence" maxlength="250" required></label><button>환급·정산 확인 기록</button>
                    </form>
                    <form th:if="${p.effective}" method="post" th:action="@{/materialProcurementContract/{c}/invoices/{i}/payments/{p}/cancel(c=${contract.materialProcurementContractNo},i=${i.id},p=${p.id})}">
                        <label>취소 사유 <input name="reason" maxlength="250" required></label><button>지급 기록 취소</button>
                    </form>
                </div>
            </td></tr></tbody>
    </table>
</div></html>
